<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción al Curso de Inglés</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <h1>Inscripción al Curso de Inglés</h1>
    <p>Completa el formulario para registrar tu inscripción.</p>

    <form id="formInscripcion">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" required>

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" required>

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" required>

      <label for="nivel">Nivel actual de inglés (MCER):</label>

<select id="nivel" required>
    <option value="">Seleccione su nivel</option>
    <option value="A1">A1 - Principiante</option>
    <option value="A2">A2 - Básico</option>
    <option value="B1">B1 - Intermedio</option>
    <option value="B2">B2 - Intermedio alto</option>
</select>

      <fieldset>
        <legend>¿Qué áreas te interesa practicar?</legend>
        <label><input type="checkbox" name="intereses" value="Conversación"> Conversación</label>
        <label><input type="checkbox" name="intereses" value="Gramática"> Gramática</label>
        <label><input type="checkbox" name="intereses" value="Pronunciación"> Pronunciación</label>
        <label><input type="checkbox" name="intereses" value="Comprensión auditiva"> Comprensión auditiva</label>
        <label><input type="checkbox" name="intereses" value="Inglés para el trabajo"> Inglés para el trabajo</label>
      </fieldset>

      <label for="motivo">¿Por qué deseas estudiar inglés?</label>
      <textarea id="motivo" rows="4" required></textarea>

      <button type="submit">Registrar inscripción</button>
    </form>

    <p id="mensaje"></p>

    <section>
      <h2>Alumnos registrados</h2>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Nombre</th><th>Correo</th><th>Nivel</th><th>Intereses</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaAlumnos"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
